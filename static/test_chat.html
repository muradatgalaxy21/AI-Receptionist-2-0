<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Text-based testing interface for the AI Receptionist agent - Doctor Farooq's Dental Clinic">
    <title>AI Receptionist - Sarah | Doctor Farooq's Dental Clinic</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* -------------------------------------------------- */
        /* Design tokens                                       */
        /* -------------------------------------------------- */
        :root {
            --bg-primary:      #0c0e1a;
            --bg-secondary:    #131629;
            --bg-chat:         #10132000;
            --bg-input:        #1a1e35;
            --border-subtle:   #252a45;
            --text-primary:    #e8eaf0;
            --text-secondary:  #8b8fa8;
            --text-muted:      #4e5270;
            --accent-blue:     #4f8cff;
            --accent-purple:   #7c5cfc;
            --agent-bubble:    #1a2240;
            --user-bubble:     #1e3060;
            --system-text:     #525878;
            --success:         #34d399;
            --danger:          #f87171;
            --shadow-glow:     0 0 30px rgba(79, 140, 255, 0.18);
            --radius-bubble:   18px;
            --transition:      0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* -------------------------------------------------- */
        /* App shell -- stacks welcome and chat on top of each */
        /* -------------------------------------------------- */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* -------------------------------------------------- */
        /* Welcome / Idle screen                               */
        /* -------------------------------------------------- */
        #welcomeScreen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            /* Subtle animated gradient backdrop */
            background:
                radial-gradient(ellipse 70% 60% at 50% -10%, rgba(79,140,255,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 90% 90%, rgba(124,92,252,0.10) 0%, transparent 55%),
                var(--bg-primary);
            transition: opacity var(--transition), transform var(--transition);
            z-index: 10;
        }

        #welcomeScreen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.97);
        }

        /* Animated ring behind the avatar */
        .welcome-ring {
            position: relative;
            width: 110px;
            height: 110px;
            margin-bottom: 28px;
        }

        .welcome-ring::before,
        .welcome-ring::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1.5px solid transparent;
        }

        .welcome-ring::before {
            border-top-color: var(--accent-blue);
            border-right-color: var(--accent-blue);
            animation: spinRing 3s linear infinite;
        }

        .welcome-ring::after {
            border-bottom-color: var(--accent-purple);
            border-left-color: var(--accent-purple);
            animation: spinRing 2.2s linear infinite reverse;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .welcome-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: 800;
            color: white;
            box-shadow: 0 0 40px rgba(79,140,255,0.35);
            position: relative;
            z-index: 1;
            animation: avatarPulse 3.5s ease-in-out infinite;
        }

        @keyframes avatarPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(79,140,255,0.35); }
            50%       { box-shadow: 0 0 60px rgba(124,92,252,0.45); }
        }

        .welcome-clinic {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .welcome-name {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -0.8px;
            background: linear-gradient(135deg, #fff 30%, #a0b4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .welcome-tagline {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-weight: 400;
        }

        #startBtn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(79,140,255,0.35);
            transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
            letter-spacing: -0.2px;
        }

        #startBtn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 36px rgba(79,140,255,0.5);
        }

        #startBtn:active {
            transform: scale(0.97);
        }

        #startBtn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        #startBtn svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Spinner inside start button while connecting */
        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .welcome-footer {
            margin-top: 36px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .idle-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px rgba(52,211,153,0.6);
            animation: idleBlink 2.5s ease-in-out infinite;
        }

        @keyframes idleBlink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        /* -------------------------------------------------- */
        /* Chat screen                                         */
        /* -------------------------------------------------- */
        #chatScreen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transform: scale(1.02);
            transition: opacity var(--transition), transform var(--transition);
            z-index: 5;
        }

        #chatScreen.visible {
            opacity: 1;
            pointer-events: all;
            transform: scale(1);
        }

        /* ---- Header ---- */
        .header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, #171b30 100%);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 22px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
        }

        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 700;
            color: white;
            box-shadow: var(--shadow-glow);
            flex-shrink: 0;
        }

        .header-info { flex: 1; min-width: 0; }

        .header-name {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-status {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--danger);
            transition: background 0.4s ease;
            flex-shrink: 0;
        }

        .status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 6px rgba(52,211,153,0.5);
        }

        /* End call button */
        #endBtn {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            border: 1px solid rgba(248,113,113,0.3);
            border-radius: 20px;
            background: rgba(248,113,113,0.08);
            color: var(--danger);
            font-size: 12px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition);
            flex-shrink: 0;
        }

        #endBtn:hover {
            background: rgba(248,113,113,0.16);
            border-color: rgba(248,113,113,0.5);
        }

        #endBtn svg { width: 14px; height: 14px; }

        /* ---- Chat Area ---- */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
            /* Faint grid pattern for depth */
            background:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(79,140,255,0.04) 0%, transparent 70%),
                var(--bg-primary);
        }

        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 99px; }

        /* ---- Messages ---- */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 72%;
            animation: msgSlideIn 0.28s ease-out;
        }

        @keyframes msgSlideIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.assistant { align-self: flex-start; }
        .message.user      { align-self: flex-end; }
        .message.system    { align-self: center; max-width: 90%; }

        .message-bubble {
            padding: 11px 15px;
            border-radius: var(--radius-bubble);
            font-size: 14px;
            line-height: 1.58;
            letter-spacing: -0.08px;
        }

        .message.assistant .message-bubble {
            background: var(--agent-bubble);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(79,140,255,0.10);
        }

        .message.user .message-bubble {
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(79,140,255,0.14);
        }

        .message.system .message-bubble {
            background: transparent;
            color: var(--system-text);
            font-size: 11.5px;
            text-align: center;
            padding: 4px 10px;
            font-style: italic;
        }

        .message-label {
            font-size: 10.5px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .message.user .message-label { text-align: right; }

        /* Thinking dots */
        .thinking-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 14px 18px;
        }

        .thinking-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-blue);
            border-radius: 50%;
            animation: thinkPulse 1.4s ease-in-out infinite;
        }

        .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes thinkPulse {
            0%, 100% { opacity: 0.25; transform: scale(0.75); }
            50%       { opacity: 1;    transform: scale(1.1); }
        }

        /* Goodbye overlay (shows briefly before returning to welcome) */
        #goodbyeOverlay {
            position: absolute;
            inset: 0;
            background: rgba(12, 14, 26, 0.88);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            backdrop-filter: blur(6px);
        }

        #goodbyeOverlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .goodbye-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            box-shadow: 0 0 30px rgba(79,140,255,0.35);
            animation: goodbyePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes goodbyePop {
            from { transform: scale(0.5); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }

        .goodbye-text {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text-primary);
        }

        .goodbye-sub {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ---- Input Area ---- */
        .input-area {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-subtle);
            padding: 14px 22px;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 11px 16px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 44px;
            max-height: 110px;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .input-field:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(79,140,255,0.10);
        }

        .input-field::placeholder { color: var(--text-muted); }
        .input-field:disabled { opacity: 0.4; cursor: not-allowed; }

        .send-btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--transition), opacity var(--transition), box-shadow var(--transition);
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.06);
            box-shadow: var(--shadow-glow);
        }

        .send-btn:active:not(:disabled) { transform: scale(0.94); }
        .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .send-btn svg { width: 19px; height: 19px; }

        .input-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 7px;
            text-align: center;
        }

        /* ---- Responsive ---- */
        @media (max-width: 600px) {
            .chat-area  { padding: 14px; }
            .message    { max-width: 88%; }
            .header     { padding: 10px 14px; }
            .input-area { padding: 10px 14px; }
            .welcome-name { font-size: 26px; }
        }
    </style>
</head>
<body>
<div id="app">

    <!-- ================================================== -->
    <!-- Welcome / Idle Screen                              -->
    <!-- ================================================== -->
    <div id="welcomeScreen">
        <div class="welcome-ring">
            <div class="welcome-avatar">S</div>
        </div>

        <div class="welcome-clinic">Doctor Farooq's Dental Clinic</div>
        <div class="welcome-name">Hi, I&rsquo;m Sarah</div>
        <div class="welcome-tagline">Your AI Receptionist &mdash; here to help you book appointments</div>

        <button id="startBtn" onclick="startConversation()">
            <!-- Microphone icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8"  y1="23" x2="16" y2="23"/>
            </svg>
            <span id="startBtnLabel">Start Conversation</span>
            <div class="btn-spinner" id="btnSpinner"></div>
        </button>

        <div class="welcome-footer">
            <div class="idle-dot"></div>
            Server is online &amp; ready
        </div>
    </div>

    <!-- ================================================== -->
    <!-- Chat Screen                                        -->
    <!-- ================================================== -->
    <div id="chatScreen">

        <!-- Header -->
        <div class="header">
            <div class="header-avatar">S</div>
            <div class="header-info">
                <div class="header-name">Sarah &mdash; AI Receptionist</div>
                <div class="header-status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Connecting&hellip;</span>
                </div>
            </div>
            <button id="endBtn" onclick="endSession()" title="End conversation">
                <!-- Phone off icon -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.42 19.42 0 0 1 4.42 8.76 2 2 0 0 1 6.41 6.6h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11z"/>
                    <line x1="23" y1="1" x2="1" y2="23"/>
                </svg>
                End Call
            </button>
        </div>

        <!-- Messages -->
        <div class="chat-area" id="chatArea"></div>

        <!-- Goodbye flash overlay -->
        <div id="goodbyeOverlay">
            <div class="goodbye-icon">S</div>
            <div class="goodbye-text">Goodbye! See you soon.</div>
            <div class="goodbye-sub">Returning to the main screen&hellip;</div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea
                    id="messageInput"
                    class="input-field"
                    placeholder="Type a message to Sarah..."
                    rows="1"
                    disabled
                ></textarea>
                <button class="send-btn" id="sendBtn" disabled title="Send message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2"  x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
            <div class="input-hint">Press Enter to send &middot; Shift+Enter for new line</div>
        </div>
    </div>

</div>

<script>
    // ================================================================
    // DOM references
    // ================================================================
    const welcomeScreen  = document.getElementById('welcomeScreen');
    const chatScreen     = document.getElementById('chatScreen');
    const chatArea       = document.getElementById('chatArea');
    const messageInput   = document.getElementById('messageInput');
    const sendBtn        = document.getElementById('sendBtn');
    const statusDot      = document.getElementById('statusDot');
    const statusText     = document.getElementById('statusText');
    const startBtn       = document.getElementById('startBtn');
    const startBtnLabel  = document.getElementById('startBtnLabel');
    const btnSpinner     = document.getElementById('btnSpinner');
    const goodbyeOverlay = document.getElementById('goodbyeOverlay');

    let ws = null;

    // ================================================================
    // Screen transitions
    // ================================================================
    function showChat() {
        welcomeScreen.classList.add('hidden');
        chatScreen.classList.add('visible');
    }

    function showWelcome() {
        chatScreen.classList.remove('visible');
        welcomeScreen.classList.remove('hidden');

        // Reset start button back to initial state
        startBtn.disabled = false;
        startBtnLabel.textContent = 'Start Conversation';
        btnSpinner.style.display = 'none';
        startBtn.querySelector('svg').style.display = '';
    }

    // ================================================================
    // Start a new conversation session
    // ================================================================
    function startConversation() {
        // Disable button and show spinner while connecting
        startBtn.disabled = true;
        startBtnLabel.textContent = 'Connecting...';
        btnSpinner.style.display = 'block';
        startBtn.querySelector('svg').style.display = 'none';

        // Clear any messages left over from a previous session
        chatArea.innerHTML = '';
        goodbyeOverlay.classList.remove('visible');

        // Update header status
        statusDot.classList.remove('connected');
        statusText.textContent = 'Connecting...';
        messageInput.disabled = true;
        sendBtn.disabled = true;

        // Transition to chat screen immediately (shows connecting state)
        showChat();

        // Open WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/test-chat`;
        ws = new WebSocket(wsUrl);

        ws.onopen = function () {
            // Connection established -- enable input
            statusDot.classList.add('connected');
            statusText.textContent = 'Connected to Sarah';
            messageInput.disabled = false;
            sendBtn.disabled = false;
            messageInput.focus();
        };

        ws.onmessage = function (event) {
            try {
                const data = JSON.parse(event.data);
                const role    = data.role    || 'system';
                const content = data.content || '';

                // ---- Handle special control messages ----

                // Agent finished -- show goodbye overlay then return to welcome
                if (role === 'session_ended') {
                    handleSessionEnded();
                    return;
                }

                // Thinking indicator
                if (role === 'system' && content.includes('thinking')) {
                    showThinking();
                    return;
                }

                // Regular message
                if (role === 'assistant') {
                    removeThinking();
                }

                addMessage(role, content);

            } catch (e) {
                console.error('Failed to parse message:', e);
            }
        };

        ws.onclose = function (event) {
            // Unexpected disconnection (not triggered by session_ended signal)
            statusDot.classList.remove('connected');
            statusText.textContent = 'Disconnected';
            messageInput.disabled = true;
            sendBtn.disabled = true;

            // Only show the disconnect notice if the goodbye overlay is NOT up
            // (i.e. this was not a clean agent-initiated close)
            if (!goodbyeOverlay.classList.contains('visible')) {
                addMessage('system', 'Connection closed. Click "Start Conversation" to try again.');
                // Return to welcome after a short pause
                setTimeout(showWelcome, 3500);
            }
        };

        ws.onerror = function () {
            addMessage('system', 'Connection error. Is the server running?');
        };
    }

    // ================================================================
    // Clean agent-initiated session end (farewell detected)
    // ================================================================
    function handleSessionEnded() {
        // Disable input immediately
        messageInput.disabled = true;
        sendBtn.disabled = true;
        statusText.textContent = 'Session ended';
        statusDot.classList.remove('connected');

        // Show the goodbye overlay
        goodbyeOverlay.classList.add('visible');

        // Close the WebSocket cleanly from our side
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.close(1000, 'Session ended by agent');
        }

        // After 2.8 seconds return to the welcome screen
        setTimeout(() => {
            goodbyeOverlay.classList.remove('visible');
            showWelcome();
        }, 2800);
    }

    // ================================================================
    // Manual end-call button (user hangs up)
    // ================================================================
    function endSession() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.close(1000, 'User ended session');
        }
        addMessage('system', 'You ended the conversation.');
        messageInput.disabled = true;
        sendBtn.disabled = true;
        statusDot.classList.remove('connected');
        statusText.textContent = 'Disconnected';
        setTimeout(showWelcome, 1800);
    }

    // ================================================================
    // Message rendering
    // ================================================================
    function addMessage(role, content) {
        if (!content) return;

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;

        const label = document.createElement('div');
        label.className = 'message-label';
        label.textContent = role === 'assistant' ? 'Sarah' : role === 'user' ? 'You' : '';

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.textContent = content;

        if (role !== 'system') {
            msgDiv.appendChild(label);
        }
        msgDiv.appendChild(bubble);
        chatArea.appendChild(msgDiv);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function showThinking() {
        removeThinking();
        const el = document.createElement('div');
        el.className = 'message assistant';
        el.id = 'thinkingIndicator';
        el.innerHTML = `
            <div class="message-label">Sarah</div>
            <div class="message-bubble">
                <div class="thinking-indicator">
                    <div class="thinking-dot"></div>
                    <div class="thinking-dot"></div>
                    <div class="thinking-dot"></div>
                </div>
            </div>`;
        chatArea.appendChild(el);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeThinking() {
        const el = document.getElementById('thinkingIndicator');
        if (el) el.remove();
    }

    // ================================================================
    // Send message
    // ================================================================
    function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

        addMessage('user', text);
        ws.send(JSON.stringify({ text }));
        messageInput.value = '';
        messageInput.style.height = 'auto';
        messageInput.focus();
    }

    // ================================================================
    // Event listeners
    // ================================================================
    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // Auto-resize textarea
    messageInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 110) + 'px';
    });
</script>
</body>
</html>
